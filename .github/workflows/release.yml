name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.8.5)'
        required: false
        default: 'v0.8.5'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            platform: 'windows-x86_64'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'

          # Windows aarch64 (ARM64)
          - os: windows-latest
            platform: 'windows-aarch64'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'

          # macOS Universal (Intel + Apple Silicon)
          - os: macos-latest
            platform: 'macos-universal'
            target: 'x86_64-apple-darwin,aarch64-apple-darwin'
            args: '--target universal-apple-darwin'

          # Linux x86_64
          - os: ubuntu-22.04
            platform: 'linux-x86_64'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'

          # Linux aarch64 (ARM64)
          - os: ubuntu-24.04-arm
            platform: 'linux-aarch64'
            target: 'aarch64-unknown-linux-gnu'
            args: '--target aarch64-unknown-linux-gnu'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'Spektaurs ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: 'Cross-platform acoustic spectrum analyser reimplementation in Rust + Tauri.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
