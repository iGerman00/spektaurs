[package]
name = "spek-tauri"
version = "0.8.5"
description = "Acoustic spectrum analyser - Rust + Tauri port of Spek"
authors = ["Spek Contributors"]
edition = "2021"
repository = "https://github.com/alexkay/spek"
license = "GPL-3.0"
rust-version = "1.77"

[lib]
name = "spek_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", features = ["all"] }
realfft = "3"
rustfft = "6"
directories = "5"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls-manual-roots"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
rayon = "1"
image = { version = "0.25", features = ["png"] }
log = "0.4"
env_logger = "0.11"
